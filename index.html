<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6C3BE4">
<title>애프터파티 베타</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --p:#6C3BE4; --p-dark:#4B22B8; --p-soft:#F1EBFF; --p-line:#DCCDFF;
  --bg:#F7F5FB; --card:#fff; --ink:#1D1530; --muted:#7A7290; --line:#E9E4F2;
  --green:#12A26B; --green-soft:#E3F7EE; --amber:#C77A00; --amber-soft:#FFF3DC;
  --blue:#2F6FE4; --blue-soft:#E6EEFF; --red:#D93A4A; --red-soft:#FDE8EA; --gray-soft:#EFEDF3;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#ECE8F4;color:var(--ink);font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
#app.noNav{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
#app.hasFooter{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
#app.hasFooterNav{padding-bottom:calc(150px + env(safe-area-inset-bottom))}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:rgba(247,245,251,.92);backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 18px 12px}
.hdr h1{font-size:19px;font-weight:800;margin:0;flex:1;letter-spacing:-.3px}
.iconbtn{border:0;background:transparent;padding:6px;border-radius:10px;display:grid;place-items:center;color:var(--ink);cursor:pointer}
.iconbtn:active{background:var(--line)}
main{padding:4px 18px 18px}

/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:6px 0;cursor:pointer;position:relative}
.nav button.on{color:var(--p);font-weight:700}
.nav .dot{position:absolute;top:3px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* footer action */
.footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:30}

#app .footer.aboveNav{bottom:calc(58px + env(safe-area-inset-bottom));padding-bottom:10px}

/* basics */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.card.tap{cursor:pointer;transition:transform .08s}
.card.tap:active{transform:scale(.99)}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.b{font-weight:700}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.sec{font-size:13px;font-weight:700;color:var(--muted);margin:22px 2px 8px}
.title{font-size:17px;font-weight:800;letter-spacing:-.2px;margin:2px 0}
.price{font-size:18px;font-weight:800;color:var(--p)}
.chip{display:inline-flex;align-items:center;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--p-soft);color:var(--p-dark);font-weight:500}
.badge{display:inline-flex;font-size:12px;font-weight:700;padding:3px 9px;border-radius:8px}
.badge.gray{background:var(--gray-soft);color:var(--muted)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.purple{background:var(--p-soft);color:var(--p)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{background:var(--bg);border-radius:12px;padding:10px 12px}
.kv .k{font-size:12px;color:var(--muted)}
.kv .v{font-weight:700;margin-top:1px}
.notice{background:var(--p-soft);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--p-dark)}
.notice.amber{background:var(--amber-soft);color:#7A4A00}
.notice.green{background:var(--green-soft);color:#0B6B47}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
.empty .big{font-size:34px;margin-bottom:6px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
table.rf{width:100%;border-collapse:collapse;font-size:13.5px}
table.rf td{padding:8px 4px;border-bottom:1px solid var(--line)}
table.rf td:last-child{text-align:right;font-weight:700}
a.tel{color:var(--p);font-weight:700;text-decoration:none}

/* buttons */
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:15.5px;cursor:pointer;width:100%;background:var(--p);color:#fff;transition:filter .1s}
.btn:active{filter:brightness(.92)}
.btn:disabled{opacity:.55}
.btn.sec2{background:var(--p-soft);color:var(--p-dark)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.sm{padding:9px 12px;font-size:14px;border-radius:11px;width:auto}
.btns{display:flex;gap:8px;margin-top:12px}
.btns .btn{flex:1}
.link{background:none;border:0;color:var(--p);font-weight:700;cursor:pointer;padding:8px}

/* forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field .hint{font-size:12px;color:var(--muted);margin-top:5px}
.in{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 13px;outline:none;font-size:15.5px}
.in:focus{border-color:var(--p)}
textarea.in{min-height:84px;resize:vertical}
.seg{display:flex;background:var(--gray-soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 4px;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(30,10,60,.1)}
.chks{display:flex;flex-wrap:wrap;gap:8px}
.chks label{position:relative;cursor:pointer}
.chks input{position:absolute;opacity:0;pointer-events:none}
.chks span{display:inline-block;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;font-weight:500}
.chks input:checked+span{border-color:var(--p);background:var(--p-soft);color:var(--p-dark);font-weight:700}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* auth */
.auth{padding:calc(40px + env(safe-area-inset-top)) 24px 30px;min-height:100vh;display:flex;flex-direction:column}
.auth .hero{text-align:center;margin:20px 0 30px}
.auth .hero h1{font-size:28px;font-weight:800;margin:14px 0 2px;letter-spacing:-.5px}
.auth .hero p{margin:0;color:var(--muted)}
.rolepick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.rolepick button{border:2px solid var(--line);background:#fff;border-radius:16px;padding:16px 10px;cursor:pointer;text-align:center}
.rolepick button.on{border-color:var(--p);background:var(--p-soft)}
.rolepick .e{font-size:26px}
.rolepick .t{font-weight:800;margin-top:4px}
.rolepick .d{font-size:12px;color:var(--muted)}
.demo{margin-top:22px;border:1.5px dashed var(--p-line);border-radius:16px;padding:14px;background:#fff}
.demo .btns{flex-wrap:wrap}
.demo .btn{flex:1 1 30%}

/* sheet & toast */
.sheet-bg{position:fixed;inset:0;background:rgba(20,10,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .2s ease-out}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.sheet h3{margin:0 0 14px;font-size:18px;font-weight:800}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:60;max-width:90%;text-align:center;animation:fade .15s}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.spin{width:26px;height:26px;border:3px solid var(--p-soft);border-top-color:var(--p);border-radius:50%;margin:0 auto 10px;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .n{font-size:22px;font-weight:800}
.stat .l{font-size:12px;color:var(--muted)}
.stars{color:#F5A623;font-weight:700}
.demo-flag{position:fixed;top:calc(8px + env(safe-area-inset-top));right:max(10px,calc(50% - 230px));z-index:40;font-size:11px;background:var(--amber-soft);color:var(--amber);padding:3px 8px;border-radius:8px;font-weight:700;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   애프터파티 베타 — 고려대 안암
   ---------------------------------------------------------
   ▶ Supabase 연결: 아래 두 값을 채우면 실제 서버로 동작합니다.
     비워 두면 "데모 모드"(이 브라우저에만 저장)로 동작합니다.
   ========================================================= */
const CONFIG = {
  SUPABASE_URL: 'https://yjcinjpernyqyuoxlutk.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_GL_xV42Or9Un8eYwrbs3EQ_xuWDFryt',   // Publishable key (공개용)
  CONTACT_KAKAO: '',       // 운영진 문의 링크(선택), 예: 오픈채팅 주소
};
const DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY;

/* ---------- 공통 유틸 ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => (n === null || n === undefined || n === '' || isNaN(n)) ? '-' : Number(n).toLocaleString('ko-KR') + '원';
const num = v => (v === '' || v === null || v === undefined) ? null : Number(v);
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const today = () => ymd(new Date());
function parseD(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = parseD(s); d.setDate(d.getDate()+n); return ymd(d); }
function daysUntil(s){ return Math.round((parseD(s) - parseD(today())) / 86400000); }
function fmtDate(s){ if(!s) return ''; const d = parseD(s); return `${d.getMonth()+1}/${d.getDate()}(${'일월화수목금토'[d.getDay()]})`; }
function dday(s){ const n = daysUntil(s); return n === 0 ? 'D-DAY' : n > 0 ? `D-${n}` : `${-n}일 지남`; }
function ago(iso){ const m = Math.floor((Date.now() - new Date(iso)) / 60000); if(m < 1) return '방금'; if(m < 60) return m+'분 전'; if(m < 1440) return Math.floor(m/60)+'시간 전'; return Math.floor(m/1440)+'일 전'; }
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36));
const clone = o => JSON.parse(JSON.stringify(o));

/* 표준 환불 규정 (기획안 5장 — 시범 운영에서 조정) */
const REFUND = [['행사 7일 전까지','100% 환불'],['행사 3~6일 전','50% 환불'],['행사 2일 전 ~ 당일','환불 없음']];
const refundRate = d => { const n = daysUntil(d); return n >= 7 ? 100 : n >= 3 ? 50 : 0; };
const LOCK_DAYS = 3; // 인원 확정 기준일: 행사 3일 전
const TAGS = ['룸','단체석','무제한','주류 할인','안주 서비스','늦게까지'];

/* =========================================================
   데이터 계층: 같은 함수 이름으로 Supabase / 데모(localStorage)를 바꿔 끼움
   ========================================================= */
const Remote = {
  sb: null,
  async init(){
    await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; s.onload = ok; s.onerror = () => no(new Error('서버 라이브러리를 불러오지 못했어요')); document.head.appendChild(s); });
    this.sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  },
  err(e){
    const m = e?.message || String(e);
    if(/Invalid login/i.test(m)) return new Error('이메일 또는 비밀번호가 맞지 않아요');
    if(/already registered/i.test(m)) return new Error('이미 가입된 이메일이에요');
    if(/Email not confirmed/i.test(m)) return new Error('메일함에서 가입 확인 링크를 먼저 눌러 주세요');
    if(/Password should be/i.test(m)) return new Error('비밀번호는 6자 이상이어야 해요');
    if(/row-level security/i.test(m)) return new Error('권한이 없어요 (승인 여부를 확인해 주세요)');
    return new Error(m);
  },
  async signUp(email, password, meta){
    const { data, error } = await this.sb.auth.signUp({ email, password, options:{ data: meta } });
    if(error) throw this.err(error);
    return { id: data.user?.id, needsConfirm: !data.session };
  },
  async signIn(email, password){
    const { data, error } = await this.sb.auth.signInWithPassword({ email, password });
    if(error) throw this.err(error);
    return data.user.id;
  },
  async signOut(){ await this.sb.auth.signOut(); },
  async currentUserId(){ const { data } = await this.sb.auth.getSession(); return data.session?.user?.id || null; },
  async select(table, match = {}){
    let q = this.sb.from(table).select('*');
    for(const [k, v] of Object.entries(match)){
      if(Array.isArray(v)){ if(!v.length) return []; q = q.in(k, v); } else q = q.eq(k, v);
    }
    const { data, error } = await q.order('created_at', { ascending:false });
    if(error) throw this.err(error);
    return data;
  },
  async insert(table, row){
    const { data, error } = await this.sb.from(table).insert(row).select().single();
    if(error) throw this.err(error); return data;
  },
  async update(table, id, patch, key = 'id'){
    const { data, error } = await this.sb.from(table).update(patch).eq(key, id).select().single();
    if(error) throw this.err(error); return data;
  },
  async upsert(table, row){
    const { data, error } = await this.sb.from(table).upsert(row).select().single();
    if(error) throw this.err(error); return data;
  },
};

const LS_KEY = 'afterparty_demo_v1';
let MEM = null;
function memDB(){
  if(!MEM){ try{ MEM = JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){ MEM = null; } }
  if(!MEM){ MEM = seed(); persist(); }
  return MEM;
}
function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(MEM)); }catch(e){} }
const Local = {
  async init(){},
  async signUp(email, password, meta){
    const d = memDB(); email = email.trim().toLowerCase();
    if(d.users.find(u => u.email === email)) throw new Error('이미 가입된 이메일이에요');
    if(password.length < 6) throw new Error('비밀번호는 6자 이상이어야 해요');
    const id = uid(); d.users.push({ id, email, password });
    const role = meta.role === 'owner' ? 'owner' : 'student';
    d.profiles.push({ id, role, name: meta.name||'', phone: meta.phone||'', org: meta.org||'', store_name: meta.store_name||'', store_address: meta.store_address||'', store_desc:'', approved: role === 'student', created_at: new Date().toISOString() });
    d.session = id; persist(); return { id, needsConfirm:false };
  },
  async signIn(email, password){
    const d = memDB(); const u = d.users.find(x => x.email === email.trim().toLowerCase() && x.password === password);
    if(!u) throw new Error('이메일 또는 비밀번호가 맞지 않아요');
    d.session = u.id; persist(); return u.id;
  },
  async signOut(){ memDB().session = null; persist(); },
  async currentUserId(){ return memDB().session || null; },
  async select(table, match = {}){
    const rows = (memDB()[table] || []).filter(r => Object.entries(match).every(([k, v]) => Array.isArray(v) ? v.includes(r[k]) : r[k] === v));
    rows.sort((a, b) => String(b.created_at||'').localeCompare(String(a.created_at||'')));
    return clone(rows);
  },
  async insert(table, row){
    const r = { id: uid(), created_at: new Date().toISOString(), ...row };
    memDB()[table].push(r); persist(); return clone(r);
  },
  async update(table, id, patch, key = 'id'){
    const r = memDB()[table].find(x => x[key] === id);
    if(!r) throw new Error('데이터를 찾을 수 없어요');
    Object.assign(r, patch); persist(); return clone(r);
  },
  async upsert(table, row){
    const t = memDB()[table]; const k = table === 'owner_private' ? 'owner_id' : 'id';
    const r = t.find(x => x[k] === row[k]);
    if(r) Object.assign(r, row); else t.push({ created_at: new Date().toISOString(), ...row });
    persist(); return clone(row);
  },
};

function seed(){
  const t = today(), now = Date.now(), iso = m => new Date(now - m*60000).toISOString();
  const S1='u-student', S2='u-student2', O1='u-owner1', O2='u-owner2', O3='u-pending', A='u-admin';
  const acc1 = '국민 000000-00-000000 (박사장)', acc2 = '신한 110-000-000000 (이사장)';
  return {
    session: null,
    users: [
      { id:S1, email:'student@demo.kr', password:'demo1234' },
      { id:O1, email:'owner@demo.kr', password:'demo1234' },
      { id:O2, email:'owner2@demo.kr', password:'demo1234' },
      { id:O3, email:'pending@demo.kr', password:'demo1234' },
      { id:A,  email:'admin@demo.kr', password:'demo1234' },
    ],
    profiles: [
      { id:S1, role:'student', name:'김고대', phone:'010-1234-5678', org:'국제학부 학생회', store_name:'', store_address:'', store_desc:'', approved:true, created_at:iso(9000) },
      { id:S2, role:'student', name:'이안암', phone:'010-2222-3333', org:'경영대 축구 동아리', store_name:'', store_address:'', store_desc:'', approved:true, created_at:iso(8800) },

function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function openSheet(html){
  closeSheet();
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet"><div class="grab"></div>${html}</div>`;
  bg.addEventListener('click', e => { if(e.target === bg) closeSheet(); });
  document.body.appendChild(bg);
}

function ask(msg, ok = '확인', danger = false){

let renderToken = 0;
async function render(scrollTop = false){
  const root = $('#app'); const token = ++renderToken;
  let html, cls = '';
  try{
    if(!S.uid){ html = S.authView === 'signup' ? scrSignup() : scrLogin(); cls = 'noNav'; }
    else if(S.me.role === 'owner' && !S.me.approved){ html = await scrPending(); cls = 'noNav'; }
    else {
      const top = S.stack[S.stack.length - 1];
      const r = await SCR[top ? top.name : S.tab](top ? top.p : {});
      html = layout(r, !!top); cls = top ? (r.footer ? 'noNav hasFooter' : 'noNav') : (r.footer ? 'hasFooterNav' : '');
    }
  }catch(e){
    console.error(e);
    html = `<div class="hdr"><h1>문제가 생겼어요</h1></div><main><div class="card">${esc(e.message)}</div><button class="btn" data-act="reload">다시 시도</button>${S.uid ? '<button class="btn ghost mt8" data-act="logout">로그아웃</button>' : ''}</main>`;
    cls = 'noNav';
  }
  if(token !== renderToken) return;
  root.className = cls; root.innerHTML = html;
  if(scrollTop) window.scrollTo(0, 0);
}

function layout(r, stacked){
  const tabs = TABS[S.me.role];
  const head = `<div class="hdr">${stacked ? `<button class="iconbtn" data-act="back" aria-label="뒤로">${ic('back')}</button>` : logo(30)}<h1>${esc(r.title)}${DEMO ? ' <span class="badge amber" style="font-size:10px;vertical-align:middle">데모</span>' : ''}</h1>${r.right || `<button class="iconbtn" data-act="reload" aria-label="새로고침">${ic('refresh', 20)}</button>`}</div>`;
  const nav = stacked ? '' : `<nav class="nav">${tabs.map(([k, l, i]) => `<button class="${S.tab === k ? 'on' : ''}" data-act="tab" data-t="${k}">${ic(i)}<span>${l}</span>${r.dots && r.dots[k] ? `<span class="dot">${r.dots[k]}</span>` : ''}</button>`).join('')}</nav>`;
  const foot = r.footer ? `<div class="footer ${stacked ? '' : 'aboveNav'}">${r.footer}</div>` : '';
  return head + `<main>${r.body}</main>` + foot + nav;
}

const SCR = {};

async function ratingsFor(ownerIds){
  const rv = await DB.select('reviews', { owner_id: [...new Set(ownerIds)] });
  const m = {};
  rv.forEach(r => { (m[r.owner_id] ||= { s:0, n:0 }); m[r.owner_id].s += r.rating; m[r.owner_id].n++; });
  return m;
}

    return `<div class="card tap" data-act="openOffer" data-id="${o.id}">
      <div class="row between"><span class="small muted b">${esc(o.store_name)}</span>${r ? `<span class="small">${stars(r.s / r.n)} <span class="muted">(${r.n})</span></span>` : '<span class="xs muted">새 가게</span>'}</div>

SCR.bookings = async () => {
  const apps = await DB.select('applications', { student_id:S.uid });

  const isNow = a => ['pending','accepted','paid'].includes(a.status) || (a.status === 'confirmed' && a.event_date >= t);
  const list = apps.filter(a => S.bookSeg === 'now' ? isNow(a) : !isNow(a));
  const nNow = apps.filter(isNow).length;
  const cards = list.map(a => {
    const [lb, c] = ST_STUDENT[a.status];
    let act = '';
    if(a.status === 'pending') act = `<div class="btns"><button class="btn ghost sm" data-act="stCancel" data-id="${a.id}">지원 취소</button></div>`;
    if(a.status === 'accepted') act = `<div class="notice amber mt12"><div class="b">예약금 ${won(a.deposit)}을 입금해 주세요</div>
        <div class="mt4">계좌: <b>${esc(a.deposit_account || '사장님께 문의')}</b></div><div class="xs mt4">입금자명: ${esc(a.org)} / 인원 확정 기준일: ${fmtDate(addDays(a.event_date, -LOCK_DAYS))}</div></div>
        <div class="btns"><button class="btn ghost sm" data-act="stCancel" data-id="${a.id}">취소</button><button class="btn sm" data-act="stPaid" data-id="${a.id}">입금했어요</button></div>`;
    if(a.status === 'paid') act = `<div class="small muted mt8">사장님이 입금을 확인하면 예약이 확정돼요.</div><div class="btns"><button class="btn ghost sm" data-act="stCancel" data-id="${a.id}">예약 취소</button></div>`;
    if(a.status === 'confirmed' && a.event_date >= t) act = `<div class="notice green mt12">예약 확정! ${fmtDate(a.event_date)} ${esc(a.store_name)}에서 만나요. 인원 변경은 ${fmtDate(addDays(a.event_date, -LOCK_DAYS))}까지 사장님께 알려 주세요.</div><div class="btns"><button class="btn ghost sm" data-act="stCancel" data-id="${a.id}">예약 취소</button></div>`;

    return `<div class="card"><div class="row between">${badge(lb, c)}<span class="xs muted">${ago(a.created_at)}</span></div>
      <div class="small muted b mt8">${esc(a.store_name)}</div><div class="title">${esc(a.title)}</div>

    title: '내 예약',
    body: `<div class="seg" style="margin-bottom:14px"><button class="${S.bookSeg === 'now' ? 'on' : ''}" data-act="bookSeg" data-s="now">진행 중 ${nNow || ''}</button><button class="${S.bookSeg === 'past' ? 'on' : ''}" data-act="bookSeg" data-s="past">지난 예약</button></div>

};

/* ----- 사장님: 받은 지원 ----- */
SCR.inbox = async () => {
  const apps = await DB.select('applications', { owner_id:S.uid });
  const t = today();
  const seg = {
    pending: a => a.status === 'pending',
    active: a => ['accepted','paid'].includes(a.status),
    confirmed: a => a.status === 'confirmed' && a.event_date >= t,
    past: a => ['rejected','cancelled'].includes(a.status) || (a.status === 'confirmed' && a.event_date < t),
  };
  const cnt = k => apps.filter(seg[k]).length;
  let list = apps.filter(seg[S.inboxSeg]);
  if(S.inboxSeg === 'confirmed') list.sort((a, b) => a.event_date.localeCompare(b.event_date));
  const cards = list.map(a => {
    const [lb, c] = ST_OWNER[a.status];
    let act = '';
    if(a.status === 'pending') act = `<div class="btns"><button class="btn ghost sm" data-act="owReject" data-id="${a.id}">거절</button><button class="btn sm" data-act="owAccept" data-id="${a.id}">수락</button></div>`;
    if(a.status === 'accepted') act = `<div class="small muted mt8">학생이 예약금 ${won(a.deposit)}을 입금하면 알려 드려요.</div><div class="btns"><button class="btn sec2 sm" data-act="owConfirm" data-id="${a.id}">입금 확인했어요</button></div>`;
    if(a.status === 'paid') act = `<div class="notice mt12 small">학생이 <b>입금했다고 알렸어요.</b> 계좌에서 ${won(a.deposit)} (입금자: ${esc(a.org)})를 확인해 주세요.</div><div class="btns"><button class="btn sm" data-act="owConfirm" data-id="${a.id}">입금 확인 · 예약 확정</button></div>`;
    if(a.status === 'confirmed' && a.event_date >= t) act = `<div class="xs muted mt8">인원 확정 기준일 ${fmtDate(addDays(a.event_date, -LOCK_DAYS))}</div>`;
    return `<div class="card"><div class="row between">${badge(lb, c)}<span class="xs muted">${ago(a.created_at)}</span></div>
      <div class="title mt8">${esc(a.org)} · ${a.people}명</div>
      <div class="meta"><span>📅 ${fmtDate(a.event_date)} · ${dday(a.event_date)}</span><span>${a.proposal_id ? '역제안' : '오퍼'}: ${esc(a.title)}</span></div>
      <div class="small mt8">대표자 연락처 ${tel(a.contact)}</div>
      ${a.message ? `<div class="small mt4 muted">“${esc(a.message)}”</div>` : ''}${act}</div>`;
  }).join('');
  const segs = [['pending','새 지원'],['active','입금 대기'],['confirmed','확정'],['past','지난']];
  return {
    title: '받은 지원',
    dots: { inbox: cnt('pending') + apps.filter(a => a.status === 'paid').length },
    body: `<div class="seg" style="margin-bottom:14px">${segs.map(([k, l]) => `<button class="${S.inboxSeg === k ? 'on' : ''}" data-act="inboxSeg" data-s="${k}">${l}${k !== 'past' && cnt(k) ? ' ' + cnt(k) : ''}</button>`).join('')}</div>
      ${cards || empty('📭', S.inboxSeg === 'pending' ? '새 지원이 없어요.<br>오퍼를 올리거나 역제안에 제안해 보세요.' : '해당하는 예약이 없어요.')}`,
  };
};

/* ----- 운영진 ----- */
SCR.admin = async () => {
  const profiles = await DB.select('profiles');
  const offers = await DB.select('offers');
  const apps = await DB.select('applications');
  const reqs = await DB.select('requests');
  const owners = profiles.filter(p => p.role === 'owner');
  const pending = owners.filter(p => !p.approved);
  const done = apps.filter(a => a.status === 'confirmed').length;
  const openOffers = offers.filter(o => o.status === 'open').length;
  const fromOffers = apps.filter(a => a.offer_id).length;
  const stat = (n, l) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  return {
    title: '운영',
    body: `<div class="sec" style="margin-top:6px">승인 대기 사장님 ${pending.length}</div>
      ${pending.map(p => `<div class="card"><div class="b">${esc(p.store_name)}</div><div class="small muted">${esc(p.store_address)} · 대표 ${esc(p.name)}</div>
        <div class="small mt8">전화 확인: ${tel(p.phone)} <span class="xs muted">· 가입 ${ago(p.created_at)}</span></div>
        <div class="btns"><button class="btn sm" data-act="approve" data-id="${p.id}">전화 확인 완료 · 승인</button></div></div>`).join('') || '<div class="small muted" style="padding:0 2px">대기 중인 사장님이 없어요.</div>'}
      <div class="sec">시범 운영 지표</div>
      <div class="grid2">
        ${stat(profiles.filter(p => p.role === 'student').length, '가입 학생')}
        ${stat(owners.length - pending.length, '승인된 가게')}
        ${stat(openOffers, '게시 중 오퍼')}
        ${stat(reqs.length, '역제안')}
        ${stat(apps.length, '전체 지원')}
        ${stat(done, '확정 예약')}
        ${stat(apps.length ? Math.round(done / apps.length * 100) + '%' : '-', '성사율 (확정/지원)')}
        ${stat(offers.length ? (fromOffers / offers.length).toFixed(1) : '-', '오퍼당 평균 지원')}
        ${stat(apps.filter(a => a.status === 'cancelled').length, '취소 건수')}
        ${stat(won(apps.filter(a => a.status === 'confirmed').reduce((s, a) => s + (a.deposit || 0), 0)), '확정 예약금 합계')}
      </div>
      <div class="sec">승인된 가게</div>
      ${owners.filter(p => p.approved).map(p => `<div class="card row between"><div><div class="b">${esc(p.store_name)}</div><div class="xs muted">${esc(p.phone)}</div></div><button class="btn ghost sm" data-act="unapprove" data-id="${p.id}">승인 취소</button></div>`).join('') || '<div class="small muted">없음</div>'}`,
  };
};

      ${field('제안 조건', '<textarea class="in" name="conditions" required placeholder="예: 인당 2.4만 원 코스, 20명 룸 단독, 2시간"></textarea>')}

const FORM = {
  async login(fd){ await DB.signIn(fd.get('email'), fd.get('password')); await afterLogin(); },
  async signup(fd){
    const role = S.signupRole;
    const meta = { role, name:fd.get('name'), phone:fd.get('phone'), org:fd.get('org') || '', store_name:fd.get('store_name') || '', store_address:fd.get('store_address') || '' };
    const r = await DB.signUp(fd.get('email'), fd.get('password'), meta);
    if(r.needsConfirm){ S.authView = 'login'; S.notice = '가입 확인 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인해 주세요.'; render(true); return; }
    await afterLogin(); toast(role === 'owner' ? '가입 완료! 운영진 확인 후 승인돼요' : '가입을 환영해요!');
  },
  async apply(fd, f){
    const o = (await DB.select('offers', { id:f.dataset.id }))[0];
    const people = num(fd.get('people')), date = fd.get('event_date');
    if(people < o.min_people || people > o.max_people) throw new Error(`인원은 ${o.min_people}~${o.max_people}명 사이로 적어 주세요`);
    if(date < o.start_date || date > o.end_date || date < today()) throw new Error('예약 가능 기간 안의 날짜를 골라 주세요');
    await DB.insert('applications', { offer_id:o.id, proposal_id:null, owner_id:o.owner_id, student_id:S.uid, store_name:o.store_name, title:o.title, org:fd.get('org'), people, event_date:date, contact:fd.get('contact'), message:fd.get('message') || '', deposit:o.deposit, deposit_account:'', status:'pending' });
    if(!S.me.org) await DB.update('profiles', S.uid, { org:fd.get('org') }).then(p => S.me = p).catch(() => {});
    toast('지원을 보냈어요! 사장님이 확인하면 알려 드려요');
    S.stack = []; S.tab = 'bookings'; S.bookSeg = 'now'; render(true);
  },
  async newReq(fd){
    await DB.insert('requests', { student_id:S.uid, org:fd.get('org'), people:num(fd.get('people')), event_date:fd.get('event_date'), budget_per_person:num(fd.get('budget_per_person')), message:fd.get('message') || '', status:'open' });
    toast('역제안을 올렸어요'); back();
  },
  async review(fd, f){
    const a = (await DB.select('applications', { id:f.dataset.id }))[0];
    await DB.insert('reviews', { application_id:a.id, student_id:S.uid, owner_id:a.owner_id, rating:num(fd.get('rating')), revisit:fd.get('revisit') === '1', comment:fd.get('comment') || '' });
    closeSheet(); toast('후기 고마워요!'); render();
  },
  async profile(fd){
    const patch = { name:fd.get('name'), phone:fd.get('phone') || '' };
    if(S.me.role === 'student') patch.org = fd.get('org') || '';
    S.me = await DB.update('profiles', S.uid, patch); toast('저장했어요'); render();
  },
  async offer(fd, f){
    const row = {
      title:fd.get('title'), conditions:fd.get('conditions'), price_per_person:num(fd.get('price_per_person')), deposit:num(fd.get('deposit')) || 0,
      min_people:num(fd.get('min_people')), max_people:num(fd.get('max_people')), min_order:num(fd.get('min_order')) || 0,
      start_date:fd.get('start_date'), end_date:fd.get('end_date'), time_slot:fd.get('time_slot') || '', tags:fd.getAll('tags'),
    };
    if(row.min_people > row.max_people) throw new Error('최소 인원이 최대 인원보다 많아요');
    if(row.start_date > row.end_date) throw new Error('종료일이 시작일보다 빨라요');
    if(f.dataset.id) await DB.update('offers', f.dataset.id, row);
    else await DB.insert('offers', { ...row, owner_id:S.uid, store_name:S.me.store_name, status:'open' });
    toast(f.dataset.id ? '수정했어요' : '오퍼를 게시했어요'); back();
  },
  async propose(fd, f){
    const bank = await getBank();
    if(!bank){ closeSheet(); throw new Error('가게 탭에서 예약금 받을 계좌를 먼저 등록해 주세요'); }
    await DB.insert('proposals', { request_id:f.dataset.id, owner_id:S.uid, store_name:S.me.store_name, conditions:fd.get('conditions'), price_per_person:num(fd.get('price_per_person')), deposit:num(fd.get('deposit')) || 0, deposit_account:bank, message:fd.get('message') || '', status:'pending' });
    closeSheet(); toast('제안을 보냈어요'); render();
  },
  async bank(fd){ await DB.upsert('owner_private', { owner_id:S.uid, bank_account:fd.get('bank_account') }); toast('계좌를 저장했어요'); },
  async storeInfo(fd){
    const name = fd.get('store_name');
    const changed = name !== S.me.store_name;
    S.me = await DB.update('profiles', S.uid, { store_name:name, store_address:fd.get('store_address') || '', phone:fd.get('phone') || '', store_desc:fd.get('store_desc') || '', name:fd.get('name') || S.me.name });
    if(changed){ const mine = await DB.select('offers', { owner_id:S.uid }); for(const o of mine) await DB.update('offers', o.id, { store_name:name }); }
    toast('저장했어요'); render();
  },
};

async function loadMe(){
  const p = (await DB.select('profiles', { id:S.uid }))[0];
  if(!p) throw new Error('프로필을 찾을 수 없어요. 잠시 후 다시 시도하거나 운영진에게 문의해 주세요.');
  S.me = p;
  const tabs = TABS[p.role] || TABS.student;
  if(!S.tab || !tabs.some(t => t[0] === S.tab)) S.tab = tabs[0][0];
}
async function afterLogin(){ S.uid = await DB.currentUserId(); S.stack = []; S.tab = null; S.notice = ''; await loadMe(); render(true); }

/* ---------- 이벤트 위임 ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const fn = ACT[el.dataset.act]; if(!fn) return;
  if(el.tagName === 'BUTTON') e.preventDefault();
  if(el.dataset.busy) return; el.dataset.busy = '1';
  try{ await fn(el.dataset, el); }catch(err){ console.error(err); toast(err.message || '오류가 발생했어요'); }
  finally{ delete el.dataset.busy; }
});
document.addEventListener('submit', async e => {
  const f = e.target; if(!f.dataset.form) return;
  e.preventDefault();
  const btns = [...f.querySelectorAll('button'), ...(f.id ? document.querySelectorAll(`button[form="${f.id}"]`) : [])];
  btns.forEach(b => b.disabled = true);
  try{ await FORM[f.dataset.form](new FormData(f), f); }
  catch(err){ console.error(err); toast(err.message || '오류가 발생했어요'); }
  finally{ btns.forEach(b => { if(b.isConnected) b.disabled = false; }); }
});
document.addEventListener('change', e => {
  if(e.target.id === 'fdate'){ S.f.date = e.target.value; render(); }
});

/* ---------- 시작 ---------- */
(async function boot(){
  $('#app').innerHTML = `<div class="loading"><div class="spin"></div>불러오는 중…</div>`;
  try{
    await DB.init();
    S.uid = await DB.currentUserId();
    if(S.uid) await loadMe();
    if(!DEMO) DB.sb.auth.onAuthStateChange((ev) => { if(ev === 'SIGNED_OUT'){ S.uid = null; S.me = null; render(); } });
  }catch(e){ console.error(e); S.uid = null; S.notice = ''; toast(e.message); }
  render();
  if('serviceWorker' in navigator && location.protocol === 'https:'){ try{ navigator.serviceWorker.register('sw.js').catch(() => {}); }catch(e){} }
})();
</script>
